name: Publicar página de órdenes USDTCOP

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: orders-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar órdenes del bot desde Binance
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DCA_SYMBOL: USDTCOP
        run: python orders_feed.py --output docs/orders.json
      - name: Actualizar el feed en la rama main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- docs/orders.json; then
            echo 'Sin cambios en el feed.'
          else
            git add docs/orders.json
            git commit -m 'Refresh Binance bot orders feed'
            git push origin HEAD:main
          fi
