name: Publicar página de órdenes USDTCOP

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar órdenes del bot desde Binance
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DCA_SYMBOL: USDTCOP
        run: python orders_feed.py --output docs/orders.json
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
