name: DCA USDT-COP
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Binance
        run: |
          echo '--- data-api.binance.vision ---'
          curl -s -o /dev/null -w '%{http_code}' https://data-api.binance.vision/api/v3/ping
          echo ''
          echo '--- api.binance.com ---'
          curl -s -w '\
%{http_code}' https://api.binance.com/api/v3/ping
          echo ''
          echo '--- precio USDT/COP ---'
          curl -s 'https://data-api.binance.vision/api/v3/ticker/price?symbol=USDTBRL'
          echo ''
          curl -s 'https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT' | head -c 200
