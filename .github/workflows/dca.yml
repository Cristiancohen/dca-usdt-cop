name: DCA USDT/COP alert
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [manual-order]

permissions:
  contents: write

concurrency:
  group: manual-order-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run DCA check
        run: python bot.py

  manual-order:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'manual-order'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar y enviar una orden LIMIT individual
        id: manual-order
        continue-on-error: true
        env:
          BINANCE_API_KEY: ${{ secrets.BINGTUSH_API_KEY || secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINGTUSH_API_SECRET || secrets.BINANCE_API_SECRET }}
          DCA_SYMBOL: USDTCOP
          MANUAL_ORDER_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python manual_order.py
      - name: Publicar bitácora sanitizada en main
        if: always()
        run: |
          python publish_monitor.py --run monitor/run.json --history monitor/log.json --limit 50
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- monitor/log.json; then
            echo 'La bitácora no cambió.'
          else
            git add monitor/log.json
            git commit -m 'Record manual Binance order monitor run'
            git push origin HEAD:main
          fi
      - name: Mantener fallo visible en el estado del job
        if: steps.manual-order.outcome == 'failure'
        run: exit 1
