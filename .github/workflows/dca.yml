name: DCA USDT-COP
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Binance
        run: |
          echo '--- vision ---'
          curl -s -w '
%{http_code}' https://data-api.binance.vision/api/v3/ping
          echo '--- com ---'
          curl -s -w '
%{http_code}' https://api.binance.com/api/v3/ping
          echo '--- precio ---'
          curl -s 'https://data-api.binance.vision/api/v3/ticker/price?symbol=USDTBRL'
